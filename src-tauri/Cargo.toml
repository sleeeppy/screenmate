[package]
name = "screenmate"
version = "0.1.0"
description = "Desktop mate that lives on the desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "screenmate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8.35"
percent-encoding = "2.3.2"
tauri-plugin-dialog = "2"

# Win32: 창 스타일, 커서 위치
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

# macOS: 창 목록 (CGWindowListCopyWindowInfo)
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
